<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لذة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=Amiri:wght@700&family=Tajawal:wght@400;500;700&family=Inter:wght@400;500;700&display=swap">
<style>
:root{color-scheme:light;--bg:#ffffff;--surface:#ffffff;--ink:#1b3b2f;--muted:#5f6f64;--leaf:#224b3b;--acc:#224b3b;--gold:#dba84a;--line:#e4e9e2;--chip:#eef2ec;--btn:#224b3b;--onbtn:#f5f1e5;--hero:#204d39;--cream:#f5f1e5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:70px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;line-height:1.6;padding-bottom:96px}
.hero{position:relative;overflow:hidden;background:#fff;color:var(--ink);text-align:center;padding:2px 20px 6px}
.tag{margin:8px auto 0;max-width:30ch;font-size:16px;color:var(--cream)}
.tag::after{content:"";display:block;width:44px;height:3px;border-radius:2px;background:var(--gold);margin:12px auto 0}
.act{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:16px 16px 4px}
.act a{display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:500}
.act svg{width:18px;height:18px;fill:#c8921f}
.info{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;padding:10px 16px 0;font-size:14px;color:var(--muted)}
.info a{color:var(--leaf);text-decoration:none;font-weight:500}
.loc{max-width:640px;margin:8px auto 0;padding:18px 16px;border-top:1px solid var(--line);text-align:center}
.loc h2{font-family:Tajawal,system-ui,sans-serif;font-size:26px;margin:0 0 6px;color:var(--leaf)}
.loc p{margin:0 0 12px;color:var(--ink);font-size:15px}
.mapbtn{display:inline-block;padding:10px 22px;border-radius:999px;background:var(--gold);color:var(--leaf);text-decoration:none;font-weight:700}
.sh{all:unset;box-sizing:border-box;display:flex;width:100%;justify-content:space-between;align-items:center;cursor:pointer}
.sh:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sec h2{margin-bottom:10px}
.chev{width:10px;height:10px;border-right:3px solid var(--gold);border-bottom:3px solid var(--gold);transform:rotate(45deg);transition:transform .35s ease;margin-left:6px}
.sec.open .chev{transform:rotate(-135deg)}
.panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s ease}
.sec.open>.panel,.item.open>.panel{grid-template-rows:1fr}
.pin{overflow:hidden;min-height:0}
@media (prefers-reduced-motion:reduce){.panel,.chev{transition:none}}
.sec h2{margin:0;padding:0;border:0;font-size:28px;font-weight:700;letter-spacing:0}
.sh{position:relative;justify-content:center;height:112px;border-radius:22px;overflow:hidden;color:var(--cream);text-shadow:0 1px 6px rgba(0,0,0,.35);background-color:var(--hero);background-size:150px 116px}
.sh .chev{position:absolute;inset-inline-end:22px;top:50%;margin:-8px 0 0}
.panel .pin{padding-top:0}
.pin>.d{margin-top:12px}

.sh{background-image:linear-gradient(135deg,#2f6350,#224b3b 55%,#1a3a2d);background-size:auto;height:96px;padding-bottom:12px}
.sh::after{content:"";position:absolute;bottom:16px;left:50%;width:44px;height:3px;margin-left:-22px;background:var(--gold);border-radius:2px}
.item{padding:0;overflow:hidden;border-radius:22px;box-shadow:0 4px 18px rgba(34,75,59,.10);margin-bottom:16px}
.ihd{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer}
.ihd:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.ph{display:block;aspect-ratio:16/10;background-size:cover;background-position:center;background-color:var(--chip)}
.ib{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 18px}
.ib h3{font-size:22px;margin:0;font-weight:700}
.ib .s{display:block;margin:2px 0 0;font-size:14px;color:var(--muted)}
.side{display:flex;align-items:center;gap:10px}
.cnt{min-width:24px;height:24px;border-radius:12px;background:var(--hero);color:var(--gold);font:700 13px/24px Tajawal,sans-serif;text-align:center;padding:0 7px}
.chev2{width:10px;height:10px;border-right:3px solid #c8921f;border-bottom:3px solid #c8921f;transform:rotate(45deg);transition:transform .35s ease;margin:-4px 4px 0}
.item.open .chev2{transform:rotate(-135deg);margin-top:4px}
.item>.panel .pin{padding:0 18px}
.item>.panel .pin>.row:last-child{padding-bottom:16px}
@media (prefers-reduced-motion:reduce){.chev2{transition:none}}
article.item{padding:0;border:0;border-radius:24px;overflow:hidden;isolation:isolate;transform:translateZ(0);box-shadow:0 4px 18px rgba(34,75,59,.12);margin-bottom:18px}
article.item .ph{border-radius:24px 24px 0 0;margin:0}
article.item .ib h3{font-size:22px}
.foot{text-align:center;color:var(--muted);font-size:13px;padding:8px 16px 0}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 16px;border-bottom:1px solid var(--line)}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.search:focus-visible,.btn:focus-visible,.q button:focus-visible,.act a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;padding:7px 16px;border-radius:999px;background:var(--chip);color:var(--leaf);border:0;font:inherit;font-weight:500;cursor:pointer}
.chip.on{background:var(--btn);color:var(--onbtn);box-shadow:inset 0 -3px 0 var(--gold)}
main{padding:16px;max-width:640px;margin:0 auto}
.sec{margin:6px 0 18px}
.sec h2{font-family:Tajawal,system-ui,sans-serif;font-size:29px;font-weight:700;margin:8px 0 2px;color:var(--leaf);border-inline-start:5px solid var(--gold);padding-inline-start:10px}
.sec p.d{margin:0 0 12px;color:var(--muted);font-size:14px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #f1e2bb}
.row .l{flex:1;font-weight:500}
.row .price{margin:0;min-width:84px;text-align:end}
.item .s{margin:2px 0 8px}
.item h3{margin:0;font-size:18px}
.item .s{margin:2px 0 0;font-size:14px;color:var(--muted)}
.price{margin-top:4px;font-weight:700;color:#a47212}
.q{display:flex;align-items:center;gap:10px;flex:none}
.q button{width:36px;height:36px;border-radius:50%;border:1px solid var(--leaf);background:transparent;color:var(--leaf);font-size:20px;line-height:1;cursor:pointer}
.q button.add{background:var(--gold);color:var(--leaf);border-color:var(--gold);font-weight:700}
.q b{min-width:18px;text-align:center}
.empty{text-align:center;color:var(--muted);padding:30px 0}
.bar{position:fixed;inset:auto 0 0 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.btn{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:640px;margin:0 auto;padding:14px 20px;border:0;border-radius:14px;background:var(--hero);color:var(--cream);text-decoration:none;font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.btn #tot{color:var(--gold)}
.btn[aria-disabled="true"]{background:var(--line);color:var(--muted);cursor:default;pointer-events:none}
.btn[aria-disabled="true"] #tot{color:var(--muted)}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.back{position:absolute;inset:0;background:rgba(14,30,23,.5)}
.box{position:relative;background:#fff;width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));animation:up .3s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.box{animation:none}}
.sh2{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sh2 h2{margin:0;font-size:24px;color:var(--leaf)}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:16px;cursor:pointer}
.cl{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.cl .nm{flex:1;min-width:0}
.cl .nm b{display:block;font-size:16px}
.cl .nm small{display:block;color:var(--muted);font-size:13px}
.cl .lt{font-weight:700;color:var(--leaf);min-width:70px;text-align:end}
.del{width:36px;height:36px;border:0;border-radius:50%;background:#fbeceb;color:#b3261e;cursor:pointer;display:grid;place-items:center;flex:none}
.del svg{width:18px;height:18px;fill:currentColor}
.sum{display:flex;justify-content:space-between;padding:14px 0;font-size:19px;font-weight:700;border-top:2px solid var(--gold);margin-top:4px}
.note{margin:0 0 12px;padding:10px 12px;border-radius:12px;background:#fbf3df;color:#6b4e0c;font-size:14px;line-height:1.5}
.acts{display:grid;gap:10px}
.acts .btn{justify-content:center}
.clr{padding:12px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--muted);font:inherit;cursor:pointer}
.box button:focus-visible,#cartbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.langpick{display:none;flex-direction:column;align-items:center;gap:12px;margin-top:22px;width:100%;max-width:300px;animation:lpin .6s ease .15s both}
.langpick .cap{color:var(--muted);font-size:15px;margin-bottom:2px}
.lp{width:100%;padding:15px 20px;border:0;border-radius:14px;background:var(--hero);color:var(--cream);font:700 19px Tajawal,system-ui,sans-serif;cursor:pointer;box-shadow:inset 0 -3px 0 var(--gold)}
.lp:focus-visible,.act a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@keyframes lpin{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){.langpick{animation:none}}
body.pick .langpick{display:flex}
body.pick .hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px 20px}
body.pick .act,body.pick .info,body.pick .sticky,body.pick main,body.pick .loc,body.pick .foot,body.pick .bar{display:none}
html[lang="tr"] *{font-family:Inter,system-ui,sans-serif !important}
.sx{margin-top:6px;padding:10px 0 16px;border-top:2px solid var(--gold)}
.sxh{display:flex;flex-direction:column;gap:2px;margin-bottom:2px}
.sxh b{font-size:17px;color:var(--leaf)}
.sxh small{color:var(--muted);font-size:13px}
.q .add:disabled{opacity:.35;cursor:default}
.sxh.x2{margin-top:14px;padding-top:12px;border-top:2px solid var(--gold)}
.frow{display:flex;align-items:center;gap:12px;width:100%;padding:11px 0;border:0;border-top:1px solid var(--line);background:transparent;font:inherit;color:inherit;cursor:pointer;text-align:start}
.frow .l{flex:1;font-weight:500}
.frow .ftag{color:#1f7a4a;font-weight:700;font-size:14px}
.chk{width:26px;height:26px;flex:none;border:2px solid var(--leaf);border-radius:50%;display:grid;place-items:center;background:#fff;transition:background .2s}
.frow.on .chk{background:var(--leaf)}
.frow.on .chk::after{content:"";width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.frow:disabled{opacity:.4;cursor:default}
.frow:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.lt.fr{color:#1f7a4a}
@media (prefers-reduced-motion:reduce){.chk{transition:none}}
.ics{display:inline-flex;gap:3px;vertical-align:middle;margin-inline-start:8px}
.ic{width:20px;height:20px;flex:none}
.logo{position:relative;width:min(280px,74vw);aspect-ratio:720/821;margin:0 auto}
body.pick .logo{width:min(300px,76vw)}
.logo img{position:absolute;display:block;height:auto}
.lg-leaf{left:24.444%;top:0.853%;width:49.861%}
.lg-word{left:31.25%;top:54.689%;width:34.861%}
.lg-tag{left:3.056%;top:85.018%;width:92.361%}
.lg-lz{left:32.083%;top:95.981%;width:31.528%}
body.pick .lg-leaf{animation:leaffall 2.1s cubic-bezier(.45,.05,.35,1) .15s both;will-change:transform}
body.pick .lg-word{animation:logoin .6s ease 2s both}
body.pick .lg-tag{animation:logoin .6s ease 2.35s both}
body.pick .lg-lz{animation:logoin .6s ease 2.5s both}
body.pick .langpick{animation-delay:2.75s}
@keyframes leaffall{
  0%{transform:translate(42vw,-58vh) rotate(-75deg) scale(.5);opacity:0}
  8%{opacity:1}
  26%{transform:translate(-18vw,-36vh) rotate(48deg) scale(.68)}
  46%{transform:translate(22vw,-20vh) rotate(-38deg) scale(.82)}
  66%{transform:translate(-10vw,-8vh) rotate(20deg) scale(.93)}
  83%{transform:translate(4vw,-1.5vh) rotate(-8deg) scale(.99)}
  93%{transform:translate(-1vw,.6vh) rotate(3deg) scale(1.01)}
  100%{transform:none;opacity:1}
}
@keyframes logoin{from{opacity:0;transform:translateY(12px)}}
@media (prefers-reduced-motion:reduce){body.pick .lg-leaf,body.pick .lg-word,body.pick .lg-tag,body.pick .lg-lz{animation:none}}
</style>

function ics(sa){return '<span class="ics">'+sa.ic.map(function(i){return ICONS[i]}).join("")+'</span>'}
function eachSauce(f){MENU.forEach(function(c){c.items.forEach(function(it,i){if(!it.sauce)return;SAUCES.forEach(function(sa,j){var k="S|"+c.id+i+"|"+j,q=cart[k]||0;if(q)f(it,sa,q,k)})})})}
function normalize(){
  var g=0;
  MENU.forEach(function(c){c.items.forEach(function(it,i){
    if(!it.sauce)return;var t=0;
    it.v.forEach(function(v,j){t+=cart[c.id+i+"|"+j]||0});
    g+=t;
    if(!t)SAUCES.forEach(function(sa,j){delete cart["S|"+c.id+i+"|"+j]});
  })});
  if(!g)freeSauce=-1;
  return g;
}
function totals(){
  var n=0,sum=0;
  eachLine(function(c,it,v,q){n+=q;if(v.p!=null)sum+=q*v.p});
  eachSauce(function(it,sa,q){sum+=q*sa.p});
  return {n:n,sum:sum};
}
function lab(v){return v.q+" "+TX[L].pc}
function lc(x){return String(x).toLocaleLowerCase(L==="tr"?"tr":"en")}
function fmt(p){return p+" "+CURRENCY}
function render(){
  var gq=normalize();
  var T=TX[L],h="";
  MENU.forEach(function(c){
    if(cat!=="all"&&cat!==c.id)return;
    var its=c.items.map(function(it,i){return {it:it,k:c.id+i}}).filter(function(o){return !term||lc(tx(o.it.n)+" "+tx(o.it.s)).indexOf(lc(term))>-1});
    if(!its.length)return;
    var io=(c.id in opened)?opened[c.id]:!!(term||cat===c.id);h+='<section class="sec'+(io?' open':'')+'"><h2><button class="sh b-'+c.id+'" data-s="'+c.id+'" aria-expanded="'+io+'"><span>'+tx(c.t)+'</span><span class="chev"></span></button></h2><div class="panel"><div class="pin"><p class="d">'+tx(c.d)+'</p>';
    its.forEach(function(o){
      var cnt=0;o.it.v.forEach(function(v,j){cnt+=cart[o.k+"|"+j]||0});
      var oi=!!opened["i"+o.k];
      h+='<article class="item'+(oi?' open':'')+'"><button class="ihd" data-i="'+o.k+'" aria-expanded="'+oi+'"><span class="ph '+o.it.img+'" role="img" aria-label="'+tx(o.it.n)+'"></span><span class="ib"><span><h3>'+tx(o.it.n)+'</h3><span class="s">'+tx(o.it.s)+'</span></span><span class="side">'+(cnt?'<span class="cnt">'+cnt+'</span>':'')+'<span class="chev2"></span></span></span></button><div class="panel"><div class="pin">';
      o.it.v.forEach(function(v,j){
        var k=o.k+"|"+j,q=cart[k]||0;
        h+='<div class="row"><span class="l">'+lab(v)+'</span><span class="price">'+(v.p==null?T.ask:fmt(v.p))+'</span><div class="q">'+
        (q?'<button aria-label="'+T.dec+'" data-k="'+k+'" data-d="-1">−</button><b>'+q+'</b>':'')+
        '<button class="add" aria-label="'+T.add+' '+tx(o.it.n)+' '+lab(v)+'" data-k="'+k+'" data-d="1">+</button></div></div>';
      });
      if(o.it.sauce){
        h+='<div class="sx"><div class="sxh"><b>'+T.sauces+'</b><small>'+(gq?T.freePick:T.pick)+'</small></div>';
        SAUCES.forEach(function(sa,j){
          var on=(freeSauce===j);
          h+='<button class="frow'+(on?' on':'')+'" role="checkbox" aria-checked="'+on+'"'+(gq?'':' disabled')+' data-f="'+j+'"><span class="chk"></span><span class="l">'+tx(sa.n)+ics(sa)+'</span><span class="ftag">'+T.free+'</span></button>';
        });
        h+='<div class="sxh x2"><b>'+T.extra+'</b></div>';
        SAUCES.forEach(function(sa,j){
          var k="S|"+o.k+"|"+j,q=cart[k]||0;
          h+='<div class="row"><span class="l">'+tx(sa.n)+ics(sa)+'</span><span class="price">'+fmt(sa.p)+'</span><div class="q">'+
          (q?'<button aria-label="'+T.dec+'" data-k="'+k+'" data-d="-1">−</button><b>'+q+'</b>':'')+
          '<button class="add"'+(cnt?'':' disabled')+' aria-label="'+T.add+' '+tx(sa.n)+'" data-k="'+k+'" data-d="1">+</button></div></div>';
        });
        h+='</div>';
      }
      h+='</div></div></article>';
    });
    h+='</div></div></section>';
  });
  document.getElementById("menu").innerHTML=h||'<p class="empty">'+T.none+'</p>';
  var tt=totals(),n=tt.n,sum=tt.sum;
  var sb=document.getElementById("send");if(n){sb.href=wa(orderText());sb.target="_blank";sb.rel="noopener";sb.setAttribute("aria-disabled","false")}else{sb.removeAttribute("href");sb.setAttribute("aria-disabled","true")}
  document.getElementById("tot").textContent=n?(n+" "+T.items+(sum?" · "+fmt(sum):"")):T.empty;
  document.getElementById("cartbtn").setAttribute("aria-disabled",n?"false":"true");
  if(!n)closeCart();else if(!document.getElementById("sheet").hidden)renderCart(sum);
}
function eachLine(f){MENU.forEach(function(c){c.items.forEach(function(it,i){it.v.forEach(function(v,j){var q=cart[c.id+i+"|"+j]||0;if(q)f(c,it,v,q,c.id+i+"|"+j)})})})}
function chips(){
  var h='<button class="chip'+(cat==="all"?" on":"")+'" data-c="all">'+TX[L].all+'</button>';
  MENU.forEach(function(c){h+='<button class="chip'+(cat===c.id?" on":"")+'" data-c="'+c.id+'">'+tx(c.t)+'</button>'});
  document.getElementById("chips").innerHTML=h;
}
function applyLang(){
  var T=TX[L];
  document.documentElement.lang=L;document.documentElement.dir=(L==="ar")?"rtl":"ltr";document.title=T.title;
  [].forEach.call(document.querySelectorAll("[data-t]"),function(el){el.textContent=T[el.dataset.t]});
  [].forEach.call(document.querySelectorAll("[data-ph]"),function(el){el.placeholder=T[el.dataset.ph];el.setAttribute("aria-label",T[el.dataset.ph])});
  [].forEach.call(document.querySelectorAll("[data-al]"),function(el){el.setAttribute("aria-label",T[el.dataset.al])});
  document.getElementById("langlbl").textContent=T.other;
  document.getElementById("wa").href=wa(T.ask1);
  chips();render();
}
function pick(l){L=l;document.body.classList.remove("pick");applyLang();window.scrollTo(0,0)}
document.addEventListener("click",function(e){
  if(e.target.closest("[data-close]")){closeCart();return}
  if(e.target.closest("#langbtn")){e.preventDefault();L=(L==="ar")?"tr":"ar";applyLang();return}
  var t=e.target.closest("button");if(!t)return;
  if(t.dataset.lang){pick(t.dataset.lang);return}
  if(t.id==="cartbtn"){if(t.getAttribute("aria-disabled")!=="true")openCart();return}
  if(t.id==="clr"){cart={};freeSauce=-1;render();return}
  if(t.dataset.f!==undefined){var fj=Number(t.dataset.f);freeSauce=(freeSauce===fj)?-1:fj;render();return}
  if(t.dataset.x){if(t.dataset.x==="FREE")freeSauce=-1;else cart[t.dataset.x]=0;render();return}
  if(t.dataset.k){cart[t.dataset.k]=Math.max(0,(cart[t.dataset.k]||0)+Number(t.dataset.d));render()}
  if(t.dataset.c){cat=t.dataset.c;if(cat!=="all")opened[cat]=true;chips();render()}
  if(t.dataset.i){var it2=t.closest(".item"),o2=!it2.classList.contains("open");it2.classList.toggle("open",o2);t.setAttribute("aria-expanded",o2);opened["i"+t.dataset.i]=o2}
  if(t.dataset.s){var sec=t.closest(".sec"),o=!sec.classList.contains("open");sec.classList.toggle("open",o);t.setAttribute("aria-expanded",o);opened[t.dataset.s]=o}
});
document.getElementById("q").addEventListener("input",function(e){term=e.target.value.trim();render()});

var inf="";if(INSTAGRAM)inf+='<a href="https://instagram.com/'+INSTAGRAM+'">@'+INSTAGRAM+'</a>';

function renderCart(sum){

  eachLine(function(c,it,v,q,k){
    h+='<div class="cl"><div class="nm"><b>'+tx(it.n)+'</b><small>'+lab(v)+(v.p!=null?' · '+fmt(v.p):'')+'</small></div>'+
    '<div class="q"><button aria-label="'+T.dec+'" data-k="'+k+'" data-d="-1">−</button><b>'+q+'</b><button class="add" aria-label="'+T.inc+'" data-k="'+k+'" data-d="1">+</button></div>'+

  });
  if(freeSauce>=0){
    var fs=SAUCES[freeSauce];
    h+='<div class="cl"><div class="nm"><b>'+tx(fs.n)+ics(fs)+'</b><small>'+T.freeLbl+'</small></div><span class="lt fr">'+T.free+'</span><button class="del" data-x="FREE" aria-label="'+T.del+' '+tx(fs.n)+'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 2h4v2H4V5h4l1-2Zm-3 6h12l-1 11a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L6 9Zm4 2v8h2v-8h-2Zm4 0v8h2v-8h-2Z"/></svg></button></div>';
  }
  eachSauce(function(it,sa,q,k){
    h+='<div class="cl"><div class="nm"><b>'+tx(sa.n)+ics(sa)+'</b><small>'+tx(it.n)+' · '+fmt(sa.p)+'</small></div>'+
    '<div class="q"><button aria-label="'+T.dec+'" data-k="'+k+'" data-d="-1">−</button><b>'+q+'</b><button class="add" aria-label="'+T.inc+'" data-k="'+k+'" data-d="1">+</button></div>'+
    '<span class="lt">'+fmt(sa.p*q)+'</span><button class="del" data-x="'+k+'" aria-label="'+T.del+' '+tx(sa.n)+'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 2h4v2H4V5h4l1-2Zm-3 6h12l-1 11a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L6 9Zm4 2v8h2v-8h-2Zm4 0v8h2v-8h-2Z"/></svg></button></div>';
  });
  document.getElementById("lines").innerHTML=h;
  document.getElementById("gt").textContent=sum?fmt(sum):"";
}
function openCart(){document.getElementById("sheet").hidden=false;document.body.style.overflow="hidden";renderCart(totals().sum)}
function closeCart(){document.getElementById("sheet").hidden=true;document.body.style.overflow=""}
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeCart()});
function orderText(){
  var T=TX[L],l=[T.oh];
  eachLine(function(c,it,v,q){
    var nm=tx(it.n)+(L==="tr"?" ("+it.n.ar+")":"");
    l.push("• "+nm+" – "+lab(v)+" × "+q+(v.p!=null?" = "+fmt(v.p*q):""))});
  if(freeSauce>=0){var fs=SAUCES[freeSauce];l.push("• "+tx(fs.n)+(L==="tr"?" ("+fs.n.ar+")":"")+" – "+T.freeo)}
  eachSauce(function(it,sa,q){
    var nm=tx(sa.n)+(L==="tr"?" ("+sa.n.ar+")":"");
    l.push("• "+nm+" – "+tx(it.n)+" × "+q+" = "+fmt(sa.p*q))});
  var tt=totals();
  if(tt.sum)l.push(T.ot+": "+fmt(tt.sum));
  return l.join("\n");
}
